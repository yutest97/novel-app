name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压上传的源码
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "使用源码包：$ZIP"
          unzip -q -o "$ZIP" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 工程壳
        run: |
          flutter create --platforms=android --project-name novel_app _scaffold
          cp -r _scaffold/android .
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: 装依赖
        run: flutter pub get

      - name: 打包 arm64 版 APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: 改个看得懂的文件名
        run: cp build/app/outputs/flutter-apk/app-debug.apk novel-app-arm64.apk

      - name: 发布成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 ${{ github.run_number }}
          body: 下载下面的 novel-app-arm64.apk，装到手机上即可。
          files: novel-app-arm64.apk
          prerelease: true

      - name: 留一份 Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: novel-app-debug-apk
          path: novel-app-arm64.apk
