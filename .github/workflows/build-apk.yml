name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取源码（仓库里还没有就从这个地址下载）
        run: |
          if [ ! -d lib ]; then
            echo "仓库里没有源码，开始下载…"
            curl -sSL --retry 3 -o src.b64 "https://paste.rs/HTbLx"
            base64 -d src.b64 > src.zip
            unzip -q -o src.zip -d .
            rm -f src.b64 src.zip
          else
            echo "仓库里已有源码，直接构建"
          fi
          ls -1

      - name: 固定调试签名（以后升级可直接覆盖安装）
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore
          ls -l ~/.android/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 工程壳
        run: |
          flutter create --platforms=android --project-name novel_app _scaffold
          cp -r _scaffold/android .
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: 把 compileSdk 提到 36（file_picker 要求）
        run: |
          FILE=$(ls android/app/build.gradle.kts 2>/dev/null || ls android/app/build.gradle)
          echo "构建文件：$FILE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$FILE"
          grep -n "compileSdk" "$FILE"

      - name: 装 Android 36 平台（缺了会报找不到）
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: 装依赖
        run: flutter pub get

      - name: 打包 arm64 版 APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: 改个看得懂的文件名
        run: cp build/app/outputs/flutter-apk/app-debug.apk novel-app-arm64.apk

      - name: 发布成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 ${{ github.run_number }}
          body: 下载下面的 novel-app-arm64.apk，装到手机上即可。
          files: novel-app-arm64.apk
          prerelease: true

      - name: 留一份 Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: novel-app-debug-apk
          path: novel-app-arm64.apk
