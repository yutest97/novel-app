name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取源码
        run: |
          if [ ! -d lib ]; then
            curl -sSL --retry 3 -o src.b64 "https://paste.c-net.org/ScaleDoubts"
            base64 -d src.b64 > src.zip
            unzip -q -o src.zip -d .
            rm -f src.b64 src.zip
          fi
          ls -1

      - name: 固定调试签名
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore
          ls -l ~/.android/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 工程壳
        run: |
          flutter create --platforms=android --project-name novel_app _scaffold
          cp -r _scaffold/android .
          if [ -d android_overlay ]; then
            cp -r android_overlay/. android/
            echo "已覆盖原生 MainActivity（SAF 存储桥）"
          fi
          test -f android/app/src/main/kotlin/com/example/novel_app/MainActivity.kt
          grep -n "novel_app/storage" android/app/src/main/kotlin/com/example/novel_app/MainActivity.kt
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: 装 Android 36 平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" > /dev/null 2>&1 || true
          sdkmanager "build-tools;36.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: 装依赖
        run: flutter pub get

      - name: 统一 compileSdk 36（App + 所有插件）
        run: |
          python3 - <<'PY'
          import glob, os, re

          def bump(path, is_kts):
              s = open(path).read()
              out = []
              for line in s.splitlines():
                  if re.match(r'^\s*compileSdk(Version)?\b', line):
                      i = line[:len(line) - len(line.lstrip())]
                      out.append(f'{i}compileSdk = 36' if is_kts else f'{i}compileSdkVersion 36')
                  elif is_kts and re.match(r'^\s*targetSdk(Version)?\b', line):
                      i = line[:len(line) - len(line.lstrip())]
                      out.append(f'{i}targetSdk = 36')
                  else:
                      out.append(line)
              open(path, 'w').write('\n'.join(out) + '\n')

          for f in glob.glob('android/app/build.gradle*'):
              bump(f, f.endswith('.kts'))
              print('app:', f)

          n = 0
          for f in glob.glob(os.path.expanduser('~/.pub-cache/hosted/*/*/android/build.gradle*')):
              s = open(f).read()
              if 'compileSdk' not in s:
                  continue
              new = re.sub(r'(compileSdk(?:Version)?\s*[= ]\s*)\d+', r'\g<1>36', s)
              if new != s:
                  open(f, 'w').write(new)
                  n += 1
                  print('plugin:', f)
          print('plugins patched:', n)
          PY
          grep -rn "compileSdk" ~/.pub-cache/hosted/*/file_picker-*/android/build.gradle* 2>/dev/null || true

      - name: 打包 arm64 版 APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: 用固定签名重签（保证每版指纹一致，可覆盖安装）
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" --version

          base64 -d signing/debug.keystore.b64 > /tmp/fixed.jks
          echo "=== keystore 内容 ==="
          keytool -list -keystore /tmp/fixed.jks -storepass android | head -6

          "$BT/zipalign" -f -p 4 build/app/outputs/flutter-apk/app-debug.apk /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/fixed.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out novel-app-arm64.apk \
            /tmp/aligned.apk

          echo "=== 本版签名指纹（以后每版都应完全一致）==="
          "$BT/apksigner" verify --print-certs novel-app-arm64.apk | head -8

      - name: 发布成 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 ${{ github.run_number }}
          body: 下载下面的 novel-app-arm64.apk，装到手机上即可。
          files: novel-app-arm64.apk
          prerelease: true

      - name: 留一份 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-app-debug-apk
          path: novel-app-arm64.apk
