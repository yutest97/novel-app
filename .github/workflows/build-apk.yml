name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压上传的源码
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "使用源码包：$ZIP"
          unzip -q -o "$ZIP" -d .
          ls -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 工程壳
        run: |
          flutter create --platforms=android --project-name novel_app _scaffold
          cp -r _scaffold/android .
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: 装依赖
        run: flutter pub get

      - name: 打包 debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: novel-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
